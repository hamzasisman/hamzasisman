name: Update GitHub Stats SVG

on:
  schedule:
    # Her gün UTC 03:00'te (TR saatiyle gece ~06:00) otomatik çalışır
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # İstersen Actions sekmesinden elle de tetikleyebilirsin

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu checkout et
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları yükle
        run: pip install requests

      - name: SVG'yi güncel verilerle yeniden üret
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: hamzasisman
          OUTPUT_PATH: stats-langs.svg
        run: python scripts/generate_stats_svg.py

      - name: Değişiklik varsa commit'le ve push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats-langs.svg
          git diff --staged --quiet || git commit -m "chore: GitHub stats SVG güncellendi"
          git push
